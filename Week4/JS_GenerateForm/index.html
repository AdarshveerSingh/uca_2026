<!DOCTYPE html>
<html>
<body>

<div id="FormContainer"></div>

<script>

const fields = [
  "First Name",
  "Last Name",
  "Email"
];

function generateForm() {
    return `
<form>
${fields.map(field => `
  <label for="${field}">${field}:</label>
  <input type="text" id="${field}" name="${field}"><br><br>
`).join("")}
</form>`;
}

document.getElementById("FormContainer").innerHTML = generateForm();
</script>

</body>
</html>
